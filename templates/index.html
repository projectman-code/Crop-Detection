<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Crop Recommendation</title>
	<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
	<div class="container">
		<h1>Crop Recommendation</h1>
		<form method="POST" action="/predict">
			<div class="grid">
				<label>N (Nitrogen)<input type="number" step="any" name="N" required></label>
				<label>P (Phosphorus)<input type="number" step="any" name="P" required></label>
				<label>K (Potassium)<input type="number" step="any" name="K" required></label>
				<label>Temperature (°C)<input type="number" step="any" name="temperature" required></label>
				<label>Humidity (%)<input type="number" step="any" name="humidity" required></label>
				<label>pH<input type="number" step="any" name="ph" required></label>
				<label>Rainfall (mm)<input type="number" step="any" name="rainfall" required></label>
			</div>
			<button type="submit">Recommend Crop</button>
		</form>
	</div>
</body>
</html>
